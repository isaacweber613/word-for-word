name: Compile and unit tests

# Compiles the GitHub and Play builds and runs the unit tests on GitHub's machines, so a change can be
# checked without a Gradle build on the PC, whose memory the Yiddish training jobs often fill (2026-11-25).
on:
  push:
    paths:
      - app/**
      - build.gradle.kts
      - settings.gradle.kts
      - gradle/**
      - .github/workflows/check.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew testBrowserDebugUnitTest testPlayDebugUnitTest compileSelfInstallDebugKotlin
